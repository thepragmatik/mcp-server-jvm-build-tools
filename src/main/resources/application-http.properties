# ── http profile ──
# Re-enables the servlet web server that the base application.properties disables
# (spring.main.web-application-type=none) so the documented Streamable HTTP
# transport actually binds. Activated via --spring.profiles.active=http (or the
# launcher's --http flag). server.port remains user-configurable (-Dserver.port);
# the launcher passes it, and Spring Boot's default (8080) applies otherwise.
spring.main.web-application-type=servlet
spring.ai.mcp.server.http=true