name: MCP release gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-http:
    name: Packaged HTTP protocol and adversarial gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: conformance-npm-${{ runner.os }}-0.2.0-alpha.11-${{ github.run_id }}
          restore-keys: conformance-npm-${{ runner.os }}-0.2.0-alpha.11-
      - name: Test release tag guard
        run: python3 tests/test_release_tag.py
      - name: Package server
        run: ./mvnw -B package -DskipTests --no-transfer-progress
      - name: Run pinned official scenarios and adversarial requests
        run: python3 scripts/release-gate.py
      - name: Verify Gradle and sbt middle diagnostics on both transports
        run: python3 scripts/gradle-sbt-middle-protocol-gate.py
