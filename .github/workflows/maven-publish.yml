name: Maven Release Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag, version fields, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-release-tag.py --tag "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify release metadata guard tests
        run: python3 tests/test_release_tag.py

      - name: Build, test, and verify
        run: ./mvnw -B verify --file pom.xml --no-transfer-progress

      - name: Run packaged protocol and adversarial gate
        run: python3 scripts/release-gate.py

      - name: Confirm packaged artifact
        run: test -s target/mcp-server-jvm-build-tools.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
          files: target/mcp-server-jvm-build-tools.jar
          fail_on_unmatched_files: true
